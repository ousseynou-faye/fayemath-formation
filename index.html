<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FayeMath Formation</title>
<!-- Application interne : on demande aux moteurs de recherche de ne pas la référencer -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="fayemath.ico">
<!-- Application installable sur téléphone (écran d'accueil, plein écran, hors connexion) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16213E">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<!-- Polices en ligne si une connexion existe ; sinon les polices du système prennent le relais -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Navigation principale"></nav>
  <div class="colonne">
    <header class="haut">
      <button class="btn sec" id="bt-menu" type="button" data-a="menu" aria-label="Ouvrir le menu">Menu</button>
      <form id="form-recherche" role="search">
        <input type="search" id="q" placeholder="Rechercher dans toute la formation : une notion, un outil, une entreprise…" aria-label="Rechercher dans la formation">
      </form>
      <button class="btn sec" type="button" data-a="imprimer" title="Imprimer la page affichée">Imprimer</button>
      <button class="btn sec" type="button" data-a="theme" title="Changer de thème clair ou sombre">Thème</button>
    </header>
    <main id="vue" tabindex="-1"></main>
  </div>
</div>
<noscript>Cette application a besoin de JavaScript. Ouvrez-la avec Chrome ou Edge.</noscript>
<!-- 1. Données (modifiables) -->
<script src="donnees/poles.js"></script>
<script src="donnees/pole-a.js"></script>
<script src="donnees/pole-b.js"></script>
<script src="donnees/pole-c.js"></script>
<script src="donnees/pole-d.js"></script>
<script src="donnees/glossaire.js"></script>
<script src="donnees/veille.js"></script>
<!-- 2. Moteur -->
<script src="js/etat.js"></script>
<script src="js/moteur.js"></script>
<script src="js/vues-parcours.js"></script>
<script src="js/vues-outils.js"></script>
<script src="js/vues-veille.js"></script>
<script src="js/app.js"></script>
<!-- 3. Hors connexion : actif uniquement en ligne sécurisée (https), ignoré quand on ouvre le fichier sur l'ordinateur -->
<script>
if ("serviceWorker" in navigator && location.protocol === "https:"){
  const dejaControle = !!navigator.serviceWorker.controller;      // vrai si une version était déjà installée
  navigator.serviceWorker.register("sw.js").catch(() => {});
  /* Quand une nouvelle version vient d'être téléchargée, on propose de recharger pour l'afficher. */
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!dejaControle || document.getElementById("maj")) return;
    const b = document.createElement("div"); b.id = "maj"; b.setAttribute("role", "status");
    b.innerHTML = '<span>Nouvelle version de l\'application disponible.</span><button class="btn" type="button">Recharger</button>';
    b.querySelector("button").onclick = () => location.reload();
    document.body.appendChild(b);
  });
}
</script>
</body>
</html>
